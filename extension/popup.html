<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NameFirst Pro · 实时入口核验</title>
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.js"></script>
</head>
<body>
  <main>
    <header><span class="mark" aria-hidden="true">N<span>↗</span></span><div><h1>NameFirst <b>Pro</b></h1><p>名称优先 · 证据随行</p></div></header>
    <p class="stage">Bing / 百度 · 实时入口核验预览</p>
    <section aria-labelledby="current"><h2 id="current">按名称寻找入口，查看本次证据</h2><p>开启联网权限后，在 Bing 或百度搜索平台或工具名称。当前认证来源限 Apache 官方项目数据；其他名称可能显示候选、歧义或待核验。</p><p><label><input id="enabled" type="checkbox" disabled> 启用 NameFirst Pro</label></p><p><label><input id="bing-enabled" type="checkbox" disabled> 在 Bing 搜索页显示</label></p><p><label><input id="baidu-enabled" type="checkbox" disabled> 在百度搜索页显示</label></p></section>
    <section aria-labelledby="network"><h2 id="network">联网权限</h2><p>开启后，可从你的网络读取公开 HTTPS 候选网页。这些网站会看到常规网络请求及 IP 地址；请求不携带登录凭据。</p>
      <p id="permission" role="status">正在读取权限…</p>
      <div class="actions"><button id="enable" type="button">开启联网核验权限</button><button id="disable" class="secondary" type="button">撤销权限</button></div>
    </section>
    <details><summary>连接诊断</summary><form id="probe"><label for="url">测试一个公开网页地址</label><input id="url" name="url" type="url" placeholder="https://…" autocomplete="off" spellcheck="false" required><p class="hint">只测试可读取性，不证明官方身份，也不会自动下载文件。</p><button id="run" type="submit">测试联网</button></form></details>
    <output id="result" role="status" aria-live="polite"></output>
    <footer><span id="version"></span><span>AGPL-3.0 · 本地运行</span></footer>
  </main>
</body>
</html>
